<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ppw-favicon.svg" />
    <link rel="manifest" href="/brand/ppw/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta
      name="description"
      content="Peak Performance Wellness — Wellness Room Designer. Drag-drop your space, get a costed plan."
    />
    <title>Wellness Room Designer · Peak Performance Wellness</title>
    <style>
      #designer-startup { display:none; }
      html[data-initial-house][data-ui-theme="ocean"] { --boot-canvas:#253b4c; --boot-ink:#e9f3f7; }
      html[data-initial-house][data-ui-theme="slate"] { --boot-canvas:#343c50; --boot-ink:#f0f1fa; }
      html[data-initial-house] #designer-startup { position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; margin:0; background:var(--designer-canvas,var(--boot-canvas,#94aab5)); color:var(--designer-canvas-ink,var(--boot-ink,#142d40)); font:14px system-ui,sans-serif; }
      #designer-startup strong { font-size:18px; }
      #designer-startup .boot-model { width:56px; height:56px; border:1px solid #6e8b99; border-radius:12px; background:linear-gradient(135deg,#e3edf0,#9ebdc8); box-shadow:8px 12px 20px #25425640,inset 2px 2px 4px #fffc; transform:rotate(-15deg); }
      #designer-startup .boot-track { width:116px; height:4px; border-radius:6px; overflow:hidden; background:#47627455; }
      #designer-startup .boot-track span { display:block; width:40%; height:100%; background:currentColor; animation:boot-slide 1.6s ease-in-out infinite; }
      @keyframes boot-slide { from { transform:translateX(-110%); } to { transform:translateX(360%); } }
      @media(prefers-reduced-motion:reduce) { #designer-startup .boot-track span { animation:none; } }
    </style>
    <script>
      if (/^\/(demo|embed\/designer)\/?$/.test(location.pathname) && new URLSearchParams(location.search).get('view') !== '2d') {
        const root = document.documentElement;
        root.setAttribute('data-initial-house','');
        try {
          const theme = JSON.parse(localStorage.getItem('olb.ui-preferences.v1') || '{}').theme;
          if (theme === 'ocean' || theme === 'slate') root.dataset.uiTheme = theme;
        } catch { /* Storage can be unavailable in an embedded document. */ }
      }
    </script>
  </head>
  <body class="bg-ppw-sand text-ppw-ink antialiased">
    <div id="designer-startup" role="status" aria-live="polite" data-testid="loading-3d">
      <div class="boot-model" aria-hidden="true"></div><strong>Loading 3D</strong>
      <span>Preparing your measured design</span><div class="boot-track" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
