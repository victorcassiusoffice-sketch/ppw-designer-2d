# Audit this pull request's built public demo and plumbing pitch.
# LHCI serves dist locally with SPA fallback; production and its access gate are never targets.

name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lhci:
    name: Run Lighthouse audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          # Public URLs are defined once in the local-build LHCI config.
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
