# OMS Wave 5.7 — Lighthouse CI for /products and /designer.
# Runs against the latest preview deploy URL on every PR.

name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lhci:
    name: Run Lighthouse audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://designer.ppwellness.co/products
            https://designer.ppwellness.co/designer
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
