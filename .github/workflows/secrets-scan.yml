# OMS Wave 4.9 — gitleaks secret scanner.
# Free GitHub Action; runs on every PR + every push to main.
name: Secrets scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Scan history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan PRs since
          # the 2025 breaking change — without it the action fails fast
          # with "GITHUB_TOKEN is now required to scan pull requests"
          # even on repos that don't need a paid licence.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml
