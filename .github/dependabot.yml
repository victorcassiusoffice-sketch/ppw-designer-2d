# OMS Wave 4.8 — dependency vulnerability auditor (free tier).
# Native GitHub Dependabot, free for public + private repos.
# Weekly cadence; ecosystem-aware; opens individual PRs grouped by major
# vs minor so Vic can triage at a glance.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Indian/Mauritius"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "security:audit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
