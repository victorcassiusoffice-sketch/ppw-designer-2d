<!doctype html>
<html lang="en" data-brand="olb">
  <head>
    <meta charset="UTF-8" />
    <!-- onelivebuild.com: the same app as index.html, served by middleware.ts on the One Live Build hosts. -->
    <link rel="icon" type="image/svg+xml" href="/brand/olb/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/brand/olb/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/brand/olb/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/olb/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3D32" />
    <meta
      name="description"
      content="One Live Build: every build, one live plan. Suppliers, designer, customer and workers on one drawing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Live Build" />
    <meta property="og:title" content="One Live Build" />
    <meta property="og:description" content="Every build, one live plan." />
    <meta property="og:image" content="https://onelivebuild.com/brand/olb/og-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A block house on a sandy plot with palms, the One Live Build card" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>One Live Build</title>
    <style>
      #designer-startup { display:none; }
      html[data-initial-house] #designer-startup { position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; margin:0; background:radial-gradient(ellipse at 50% 35%,#e8eddf,#c6d6ca); color:#304d42; font:14px system-ui,sans-serif; }
      #designer-startup strong { font-size:18px; }
      #designer-startup .boot-model { width:56px; height:56px; border:1px solid #afc5b7; border-radius:12px; background:linear-gradient(135deg,#f7f5e9,#b1cdbf); box-shadow:8px 12px 20px #4d6e4930,inset 2px 2px 4px #fffc; transform:rotate(-15deg); }
      #designer-startup .boot-track { width:116px; height:4px; border-radius:6px; overflow:hidden; background:#adc3b455; }
      #designer-startup .boot-track span { display:block; width:40%; height:100%; background:#658e79; animation:boot-slide 1.6s ease-in-out infinite; }
      @keyframes boot-slide { from { transform:translateX(-110%); } to { transform:translateX(360%); } }
      @media(prefers-reduced-motion:reduce) { #designer-startup .boot-track span { animation:none; } }
    </style>
    <script>
      if (/^\/(demo|embed\/designer)\/?$/.test(location.pathname) && new URLSearchParams(location.search).get('view') !== '2d') document.documentElement.setAttribute('data-initial-house','');
    </script>
  </head>
  <body class="bg-ppw-sand text-ppw-ink antialiased">
    <div id="designer-startup" role="status" aria-live="polite" data-testid="loading-3d">
      <div class="boot-model" aria-hidden="true"></div><strong>Loading 3D</strong>
      <span>Preparing your measured design</span><div class="boot-track" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
