  PPW Wellness Room Designer — Claude Design artifact (faithful duplicate)
  ========================================================================
  Source of truth: C:\Users\Victor\Documents\PPW-Code\ppw-designer-2d @ main 241de3a
  Live app:        https://designer.ppwellness.co
  Generated:       2026-07-06 (claude-design-export)

  WHAT THIS IS — a single, self-contained visual duplicate of the CURRENT
  customer Designer UI: same layout, same panels, same labels, same colour
  tokens, same boot state (blank canvas + "Start by drawing your room").
  No backend, no build step, no external requests: the 22-product K1 catalog
  is inlined as mock data, the Konva stage is reproduced as an SVG that looks
  and behaves the same for design purposes (grid, room, snap-place, select,
  rotate, drag). Paste into Claude artifacts (or open in any browser) and it
  renders on its own.

  FIDELITY CAVEATS (also in README):
  - Konva canvas -> SVG equivalent. Placement/select/rotate/drag work; the
    real app renders top-down product PHOTOS on the floor — here items render
    as the app's own category-colour fallback boxes + glyphs (no external
    images allowed in the artifact sandbox).
  - Catalog tiles show the app's real inline category SVG fallbacks instead
    of product photos (same reason).
  - Font: Inter is requested with system fallback (no webfont fetch).
  - Dark-mode toggle is present but visual-only (the live dark theme is not
    replicated). localStorage is not used (artifact constraint), so the
    3-step coach mark shows on every load — Skip it.
  - Polygon "Draw" mode is simplified (click vertices, click first vertex or
    press Enter to close). Wall tool is a visual toggle only.
-->

  function cartLines() {
    var by = {};
    S.items.forEach(function (it) {

    return Object.keys(by).map(function (pid) {
      var p = prodById(pid);
      return { p: p, qty: by[pid], line: p.price * by[pid] };
    });
  }

  function buildCatalogGrid(list) {
    if (!list.length) return h('<p class="cat-empty">No products match — try changing the region or category filter.</p>');

      var tile = h(

      li.appendChild(tile);
      ul.appendChild(li);

  function stageOrigin(svg) {
    var r = svg.getBoundingClientRect();
    return { ox: r.width / 2 - roomWm() * PX_PER_M / 2, oy: r.height / 2 - roomHm() * PX_PER_M / 2, rect: r };
  }
  function evtToMetres(e, svg) {
    var o = stageOrigin(svg);
    return { xM: (e.clientX - o.rect.left - o.ox) / PX_PER_M, yM: (e.clientY - o.rect.top - o.oy) / PX_PER_M };
  }

  function drawStage(svg, section) {
    var NS = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';
    var r = svg.getBoundingClientRect();
    if (!r.width) return;
    var o = stageOrigin(svg);

    if (S.drawMode) {
      /* draw-in-progress polyline */
      if (S.drawVerts.length) {
        var pl = document.createElementNS(NS, 'polyline');
        pl.setAttribute('points', S.drawVerts.map(function (v) { return (r.width / 2 + (v.x - 2.5) * PX_PER_M) + ',' + (r.height / 2 + (v.y - 2) * PX_PER_M); }).join(' '));
        pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#0F766E'); pl.setAttribute('stroke-width', '2');
        svg.appendChild(pl);
        S.drawVerts.forEach(function (v) {
          var c = document.createElementNS(NS, 'circle');
          c.setAttribute('cx', r.width / 2 + (v.x - 2.5) * PX_PER_M); c.setAttribute('cy', r.height / 2 + (v.y - 2) * PX_PER_M);
          c.setAttribute('r', '4'); c.setAttribute('fill', '#fff'); c.setAttribute('stroke', '#0F766E'); c.setAttribute('stroke-width', '2');
          svg.appendChild(c);
        });
      }
      return;
    }
    if (!S.room) return;

    var wPx = roomWm() * PX_PER_M, hPx = roomHm() * PX_PER_M;

    /* floor + outer wall stroke (Konva: fill #FAF7F1, stroke #0E1B1F w6, inner #3B4A52 w1) */
    var floor = document.createElementNS(NS, 'rect');
    floor.setAttribute('x', o.ox); floor.setAttribute('y', o.oy);
    floor.setAttribute('width', wPx); floor.setAttribute('height', hPx);
    floor.setAttribute('fill', '#FAF7F1'); floor.setAttribute('stroke', '#0E1B1F'); floor.setAttribute('stroke-width', '6');
    svg.appendChild(floor);
    var inner = document.createElementNS(NS, 'rect');
    inner.setAttribute('x', o.ox); inner.setAttribute('y', o.oy);
    inner.setAttribute('width', wPx); inner.setAttribute('height', hPx);
    inner.setAttribute('fill', 'none'); inner.setAttribute('stroke', '#3B4A52'); inner.setAttribute('stroke-width', '1');
    svg.appendChild(inner);

    /* 0.5 m grid, clipped to the room; major line every 2 steps */
    if (S.gridOn) {
      var g = document.createElementNS(NS, 'g');
      var step = 0.5 * PX_PER_M, i, n = 0;
      for (i = step; i < wPx; i += step, n++) {
        var lv = document.createElementNS(NS, 'line');
        lv.setAttribute('x1', o.ox + i); lv.setAttribute('y1', o.oy); lv.setAttribute('x2', o.ox + i); lv.setAttribute('y2', o.oy + hPx);
        lv.setAttribute('stroke', '#C4CBCD'); lv.setAttribute('stroke-width', n % 2 === 1 ? '1' : '0.5'); lv.setAttribute('opacity', n % 2 === 1 ? '0.9' : '0.55');
        g.appendChild(lv);
      }
      n = 0;
      for (i = step; i < hPx; i += step, n++) {
        var lh = document.createElementNS(NS, 'line');
        lh.setAttribute('x1', o.ox); lh.setAttribute('y1', o.oy + i); lh.setAttribute('x2', o.ox + wPx); lh.setAttribute('y2', o.oy + i);
        lh.setAttribute('stroke', '#C4CBCD'); lh.setAttribute('stroke-width', n % 2 === 1 ? '1' : '0.5'); lh.setAttribute('opacity', n % 2 === 1 ? '0.9' : '0.55');
        g.appendChild(lh);
      }
      svg.appendChild(g);
    }

    /* placed items — footprint boxes in the app's category fallback colours */
    S.items.forEach(function (it) {
      var p = prodById(it.productId);
      var colors = CATEGORY_FILL[p.cat] || { fill: '#F5EFE6', stroke: '#C0A67E' };
      var fw = (it.rot % 180 === 0 ? p.dims.l : p.dims.w) / 100 * PX_PER_M;
      var fh = (it.rot % 180 === 0 ? p.dims.w : p.dims.l) / 100 * PX_PER_M;
      var gx = o.ox + it.xM * PX_PER_M, gy = o.oy + it.yM * PX_PER_M;
      var grp = document.createElementNS(NS, 'g');
      grp.setAttribute('data-iid', it.iid);
      grp.style.cursor = 'move';
      var rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', gx); rect.setAttribute('y', gy);
      rect.setAttribute('width', Math.max(fw, 6)); rect.setAttribute('height', Math.max(fh, 6));
      rect.setAttribute('rx', '3');
      rect.setAttribute('fill', colors.fill); rect.setAttribute('fill-opacity', '0.55');
      var sel = it.iid === S.selectedIid;
      rect.setAttribute('stroke', sel ? '#06B6D4' : colors.stroke);
      rect.setAttribute('stroke-width', sel ? '2.5' : '1');
      grp.appendChild(rect);
      /* small category glyph centred in the footprint */
      var fo = document.createElementNS(NS, 'foreignObject');
      var gsz = Math.min(Math.max(fw, 6), Math.max(fh, 6)) * 0.6;
      fo.setAttribute('x', gx + (Math.max(fw, 6) - gsz) / 2); fo.setAttribute('y', gy + (Math.max(fh, 6) - gsz) / 2);
      fo.setAttribute('width', gsz); fo.setAttribute('height', gsz);
      fo.style.pointerEvents = 'none';
      var div = document.createElement('div');
      div.innerHTML = THUMB_SVG[p.cat];
      div.style.width = '100%'; div.style.height = '100%'; div.style.opacity = '0.85';
      div.firstChild.style.width = '100%'; div.firstChild.style.height = '100%';
      fo.appendChild(div);
      grp.appendChild(fo);
      svg.appendChild(grp);
    });
  }

  function closePolygon() {
    if (S.drawVerts.length < 3) { toast('Need at least 3 corners — keep clicking, then Close.'); return; }
    /* simplify: fit the polygon's bounding box as the room rect */
    var xs = S.drawVerts.map(function (v) { return v.x; }), ys = S.drawVerts.map(function (v) { return v.y; });
    var l = snap(Math.max.apply(null, xs) - Math.min.apply(null, xs));
    var w = snap(Math.max.apply(null, ys) - Math.min.apply(null, ys));
    S.room = { lengthM: Math.max(l, 1), widthM: Math.max(w, 1) };
    S.drawMode = false; S.drawVerts = [];
    toast('Room closed — ' + S.room.lengthM + ' × ' + S.room.widthM + ' m. (Polygon simplified to its bounding rectangle in this mockup.)');
    render();
  }

  function onStagePointerDown(e, svg, section) {
    if (S.drawMode) {
      var r = svg.getBoundingClientRect();
      var x = snap((e.clientX - r.left - r.width / 2) / PX_PER_M + 2.5);
      var y = snap((e.clientY - r.top - r.height / 2) / PX_PER_M + 2);
      if (S.drawVerts.length >= 3) {
        var f = S.drawVerts[0];
        if (Math.abs(f.x - x) < 0.4 && Math.abs(f.y - y) < 0.4) { closePolygon(); return; }
      }
      S.drawVerts.push({ x: x, y: y });
      render();
      return;
    }
    if (!S.room) return;
    var m = evtToMetres(e, svg);

    /* place armed product */
    if (S.armedProductId) {
      var p = prodById(S.armedProductId);
      var fwM = p.dims.l / 100, fhM = p.dims.w / 100;
      var xM = snap(m.xM - fwM / 2), yM = snap(m.yM - fhM / 2);
      if (m.xM < 0 || m.yM < 0 || m.xM > roomWm() || m.yM > roomHm()) { toast('Tap inside the room floor to place.'); return; }
      xM = Math.min(Math.max(xM, 0), Math.max(roomWm() - fwM, 0));
      yM = Math.min(Math.max(yM, 0), Math.max(roomHm() - fhM, 0));
      pushHistory();
      var iid = S.iidSeq++;
      S.items.push({ iid: iid, productId: p.id, xM: xM, yM: yM, rot: 0 });
      S.selectedIid = iid;
      S.armedProductId = null;
      render();
      return;
    }

    /* select / drag an item */
    var hit = e.target.closest ? e.target.closest('g[data-iid]') : null;
    if (hit) {
      var iid2 = Number(hit.getAttribute('data-iid'));
      S.selectedIid = iid2;
      var it = S.items.find(function (x) { return x.iid === iid2; });
      dragState = { iid: iid2, dx: m.xM - it.xM, dy: m.yM - it.yM, moved: false };
      render();
      return;
    }
    /* empty stage tap → deselect */
    if (S.selectedIid !== null) { S.selectedIid = null; render(); }
  }

  function onStagePointerMove(e, svg) {
    if (!dragState || !S.room) return;
    var it = S.items.find(function (x) { return x.iid === dragState.iid; });
    if (!it) return;
    var p = prodById(it.productId);
    var m = evtToMetres(e, svg);
    var fwM = (it.rot % 180 === 0 ? p.dims.l : p.dims.w) / 100;
    var fhM = (it.rot % 180 === 0 ? p.dims.w : p.dims.l) / 100;
    it.xM = Math.min(Math.max(snap(m.xM - dragState.dx), 0), Math.max(roomWm() - fwM, 0));
    it.yM = Math.min(Math.max(snap(m.yM - dragState.dy), 0), Math.max(roomHm() - fhM, 0));
    dragState.moved = true;
    drawStage(svg);
  }

  /* ---------- Floating cluster ---------- */
  function renderCluster(it, section) {
    var p = prodById(it.productId);
    var el = h('<div class="fcluster" role="toolbar" aria-label="Item controls"></div>');
    var mk = function (glyph, title, cls, fn) {
      var b = h('<button type="button" class="' + (cls || '') + '" title="' + title + '">' + glyph + '</button>');
      b.onclick = fn; el.appendChild(b);
    };
    mk('⟳', 'Rotate 90°', '', function () { pushHistory(); it.rot = (it.rot + 90) % 360; render(); });
    mk('⧉', 'Duplicate', '', function () {
      pushHistory();
      var iid = S.iidSeq++;
      S.items.push({ iid: iid, productId: it.productId, xM: Math.min(it.xM + 0.5, roomWm() - 0.5), yM: Math.min(it.yM + 0.5, roomHm() - 0.5), rot: it.rot });
      S.selectedIid = iid; render();
    });
    mk('ⓘ', 'Details', '', function () { toast('Details are in the right-hand panel'); });
    mk('🗑', 'Delete', 'danger', function () { pushHistory(); S.items = S.items.filter(function (x) { return x.iid !== it.iid; }); S.selectedIid = null; render(); });
    mk('✓', 'Done', 'confirm', function () { S.selectedIid = null; render(); });
    /* position above the item */
    requestAnimationFrame(function () {
      var svg = section.querySelector('svg.stage');
      if (!svg) return;
      var o = stageOrigin(svg);
      var fwM = (it.rot % 180 === 0 ? p.dims.l : p.dims.w) / 100;
      var cx = o.ox + (it.xM + fwM / 2) * PX_PER_M;
      var cy = o.oy + it.yM * PX_PER_M;
      var w = el.offsetWidth || 260;
      el.style.left = Math.max(8, Math.min(cx - w / 2, section.clientWidth - w - 8)) + 'px';
      el.style.top = Math.max(8, cy - 64) + 'px';
    });
    return el;
  }

    var armedP = !sel && S.armedProductId ? prodById(S.armedProductId) : null;

    function stat(label, value) {
      return '<div class="stat"><p class="microlabel">' + label + '</p><p class="v">' + value + '</p></div>';
    }

    if (selP) {
      body.innerHTML =
        '<div class="dp-thumb">' + THUMB_SVG[selP.cat] + '</div>' +

        stat('Footprint', selP.dims.l + ' × ' + selP.dims.w + ' cm · H ' + selP.dims.h + ' cm') +
        stat('Supplier', esc(selP.supplier)) +
        (selP.notes ? stat('About', esc(selP.notes)) : '');
      var acts = h('<div class="dp-actions"></div>');
      var mkA = function (label, cls, fn) { var b = h('<button type="button" class="' + (cls || '') + '">' + label + '</button>'); b.onclick = fn; acts.appendChild(b); };
      mkA('⟳ Rotate 90°', '', function () { pushHistory(); sel.rot = (sel.rot + 90) % 360; render(); });
      mkA('⧉ Duplicate', '', function () {
        pushHistory();
        var iid = S.iidSeq++;
        S.items.push({ iid: iid, productId: sel.productId, xM: Math.min(sel.xM + 0.5, roomWm() - 0.5), yM: Math.min(sel.yM + 0.5, roomHm() - 0.5), rot: sel.rot });
        S.selectedIid = iid; render();
      });
      mkA('Delete', 'del', function () { pushHistory(); S.items = S.items.filter(function (x) { return x.iid !== sel.iid; }); S.selectedIid = null; render(); });
      body.appendChild(acts);
      body.appendChild(h('<p class="dp-keys">Keys: <kbd>R</kbd> rotate · <kbd>Shift+R</kbd> CCW · <kbd>D</kbd> duplicate · <kbd>Del</kbd> delete · <kbd>Esc</kbd> deselect</p>'));
    } else if (armedP) {
      body.innerHTML =
        '<div class="dp-thumb">' + THUMB_SVG[armedP.cat] + '</div>' +
        '<div class="sec"><p class="microlabel">' + CATEGORY_LABELS[armedP.cat] + '</p><h3>' + esc(armedP.name) + '</h3></div>' +
        stat('Price', fmtMoney(armedP.price, S.currency)) +
        stat('Footprint', armedP.dims.l + ' × ' + armedP.dims.w + ' cm · H ' + armedP.dims.h + ' cm') +
        stat('Supplier', esc(armedP.supplier)) +
        (armedP.notes ? stat('About', esc(armedP.notes)) : '') +
        '<div class="dashed-tip teal">Click an empty spot on the floor to place this product. Press <kbd>Esc</kbd> to cancel.</div>';
    } else if (!S.room) {
      body.innerHTML =
        '<div class="sec"><p class="microlabel">Design summary</p><h3>No room yet</h3></div>' +
        '<div class="dashed-tip">Your canvas is blank. Use <span style="font-weight:600">Draw</span> in the top bar (or the “Draw room” button on the canvas) to sketch your space, then drag products in.</div>';
    } else {
      body.innerHTML =
        '<div class="sec"><p class="microlabel">Design summary</p><h3>Wellness Room</h3></div>' +
        stat('Room dimensions', S.room.lengthM + ' m × ' + S.room.widthM + ' m') +
        stat('Floor area', areaM2().toFixed(2) + ' m²') +
        stat('Items placed', String(S.items.length)) +
        (S.items.length ? '<button type="button" class="clear-items" style="width:100%;border-radius:6px;border:1px solid var(--ppw-stone);background:#fff;padding:6px 12px;font-size:14px;font-weight:500;color:var(--ppw-slate)">Clear all items</button>' : '') +
        '<div class="dashed-tip" style="margin-top:12px">Drag a product from the catalog onto the canvas. Selecting a placed item shows its details + controls here.</div>';
      var ci = body.querySelector('.clear-items');
      if (ci) ci.onclick = function () { S.pendingClear = 'products'; render(); };
    }
    el.appendChild(body);
    return el;
  }

    var card = h('<div class="helpov-card"><header><h2>Designer shortcuts</h2><button type="button" aria-label="Close help" style="font-size:18px">×</button></header></div>');
    card.querySelector('button').onclick = function () { S.helpOpen = false; render(); };
    SHORTCUTS.forEach(function (cat) {
      var sec = h('<section><h3>' + cat[0] + '</h3><ul style="margin:0;padding:0"></ul></section>');
      cat[1].forEach(function (row) {
        sec.querySelector('ul').appendChild(h('<li><code>' + row[0] + '</code><span>' + row[1] + '</span></li>'));
      });
      card.appendChild(sec);
    });
    scrim.appendChild(card);
    scrim.onclick = function (e) { if (e.target === scrim) { S.helpOpen = false; render(); } };
    return scrim;
  }

  /* ---------- Keyboard shortcuts ---------- */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
    if (e.key === 'Escape') {
      if (S.helpOpen) { S.helpOpen = false; render(); return; }
      if (S.pendingClear) { S.pendingClear = null; render(); return; }
      if (S.drawMode) { S.drawMode = false; S.drawVerts = []; render(); return; }
      if (S.armedProductId) { S.armedProductId = null; render(); return; }
      if (S.selectedIid !== null) { S.selectedIid = null; render(); return; }
    }
    if (e.key === '?') { S.helpOpen = true; render(); return; }
    if (e.key === 'Enter' && S.drawMode) { closePolygon(); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey && e.shiftKey && (e.key === 'P' || e.key === 'p')) { e.preventDefault(); S.pendingClear = 'products'; render(); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey && e.shiftKey && (e.key === 'X' || e.key === 'x')) { e.preventDefault(); S.pendingClear = 'all'; render(); return; }
    var sel = S.selectedIid !== null ? S.items.find(function (x) { return x.iid === S.selectedIid; }) : null;
    if (sel) {
      if (e.key === 'r' || e.key === 'R') { pushHistory(); sel.rot = (sel.rot + (e.shiftKey ? 270 : 90)) % 360; render(); return; }
      if (e.key === 'd' || e.key === 'D') {
        pushHistory();
        var iid = S.iidSeq++;
        S.items.push({ iid: iid, productId: sel.productId, xM: Math.min(sel.xM + 0.5, roomWm() - 0.5), yM: Math.min(sel.yM + 0.5, roomHm() - 0.5), rot: sel.rot });
        S.selectedIid = iid; render(); return;
      }
      if (e.key === 'Delete' || e.key === 'Backspace') { pushHistory(); S.items = S.items.filter(function (x) { return x.iid !== sel.iid; }); S.selectedIid = null; render(); return; }
    }
  });

  window.addEventListener('resize', function () {
    var svg = root && root.querySelector('svg.stage');
    if (svg) drawStage(svg, svg.parentElement);
  });

  /* ---------- Boot ---------- */
  function boot() {
    root = document.getElementById('ppw-designer-root');
    if (!root) { setTimeout(boot, 30); return; }
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
